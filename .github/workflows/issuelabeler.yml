name: "Set Issue Label"
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Add IoTSDK label
        run: gh api --method POST "repos/$REPO/issues/$ISSUE/labels" -f 'labels[]=IoTSDK'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
